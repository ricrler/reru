<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <!-- Slanted base: near-black on the left, lighter blue toward the right -->
    <linearGradient id="base" gradientUnits="userSpaceOnUse" x1="150" y1="0" x2="1450" y2="1120">
      <stop offset="0" stop-color="#010607"/>
      <stop offset=".22" stop-color="#021311"/>
      <stop offset=".45" stop-color="#081a45"/>
      <stop offset=".7" stop-color="#0b36a8"/>
      <stop offset="1" stop-color="#1a6bff"/>
    </linearGradient>
    <!-- Brighter glow on the right edge -->
    <radialGradient id="glow" cx=".95" cy=".6" r=".6">
      <stop offset="0" stop-color="#2a78ff" stop-opacity=".8"/>
      <stop offset=".5" stop-color="#1a5cff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#1a5cff" stop-opacity="0"/>
    </radialGradient>
    <!-- Teal tint, top left -->
    <radialGradient id="teal" cx=".1" cy=".15" r=".5">
      <stop offset="0" stop-color="#0c4a3f" stop-opacity=".35"/>
      <stop offset="1" stop-color="#0c4a3f" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <!-- Film grain. Raise k3 for stronger grain (keep k4 at about minus half of k3). -->
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="7" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values=".33 .33 .33 0 0  .33 .33 .33 0 0  .33 .33 .33 0 0  0 0 0 0 1" result="gray"/>
      <feComposite in="SourceGraphic" in2="gray" operator="arithmetic" k1="0" k2="1" k3=".35" k4="-.175"/>
    </filter>
  </defs>
  <g filter="url(#grain)">
    <rect width="1600" height="1120" fill="url(#base)"/>
    <rect width="1600" height="1120" fill="url(#teal)"/>
    <rect width="1600" height="1120" fill="url(#glow)"/>
    <!-- Slanted soft light bands that get stronger toward the right -->
    <g transform="rotate(-24 800 560)">
      <g filter="url(#soft)">
        <rect x="380" y="-500" width="90" height="2200" fill="#2f4fd0" opacity=".08"/>
        <rect x="640" y="-500" width="130" height="2200" fill="#2f5ad8" opacity=".12"/>
        <rect x="940" y="-500" width="110" height="2200" fill="#3a6bff" opacity=".16"/>
        <rect x="1240" y="-500" width="160" height="2200" fill="#4a7bff" opacity=".2"/>
      </g>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
